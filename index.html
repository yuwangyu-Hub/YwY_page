<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pixel Studio · 像素游戏开发工作室</title>
  <meta name="description" content="浏览器里的像素游戏开发工作室：代码 IDE、像素画、地图编辑器、Lua 运行时。数据存于本页会话，可导出 .px8 保存。">

  <!-- 设计系统 -->
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/views/code.css">
  <link rel="stylesheet" href="./css/views/sprite.css">
  <link rel="stylesheet" href="./css/views/map.css">
  <link rel="stylesheet" href="./css/views/run.css">
  <link rel="stylesheet" href="./css/views/audio.css">

  <!-- CodeMirror（代码 IDE，UMD 全局） -->
  <link rel="stylesheet" href="./vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="./vendor/codemirror/theme-material-darker.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <span class="logo">■ PIXEL STUDIO</span>
      <span class="topbar-hint">数据仅存于本页会话 · 导出 .px8 长期保存</span>
      <span class="flex-spacer"></span>
      <div class="btn-group">
        <button class="btn small" id="btn-demo" title="载入内置 Demo 项目（会覆盖当前内容）">🎮 Demo</button>
        <button class="btn small" id="btn-import" title="导入 .px8 卡带文件（兼容 .p8）">📂 导入</button>
        <button class="btn small" id="btn-export-p8" title="导出为 .px8 卡带">💾 导出 .px8</button>
        <button class="btn small" id="btn-export-png" title="导出精灵表 PNG">🖼 PNG</button>
        <button class="btn small danger" id="btn-new" title="清空当前项目">🗑 新建</button>
        <a class="btn small" href="./legacy/" title="旧版 Spritely（视频/图片转精灵图）">旧版工具 ↗</a>
      </div>
    </header>

    <nav class="tabbar">
      <button data-tab="code">⌨ 代码</button>
      <button data-tab="sprite">🎨 像素画</button>
      <button data-tab="map">🗺 地图</button>
      <button data-tab="sfx">🔊 音效</button>
      <button data-tab="music">🎵 音乐</button>
      <button data-tab="run">▶ 运行</button>
    </nav>

    <main id="view"></main>
  </div>

  <script src="./vendor/codemirror/codemirror.js"></script>
  <script src="./vendor/codemirror/mode/lua/lua.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
